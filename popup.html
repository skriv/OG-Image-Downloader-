<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OG Downloader</title>
    <style>
      html,
      body {
        width: 360px;
        min-height: 220px;
        margin: 0;
        background: #121212;
        color: #f2f2f2;
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #boot-loader {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 12px;
        min-height: 196px;
        box-sizing: border-box;
        transition: opacity 0.18s ease;
      }

      #boot-loader.boot-loader--hide {
        opacity: 0;
        pointer-events: none;
      }

      .boot-brand {
        font-size: 13px;
        font-weight: 650;
      }

      .boot-bar {
        height: 3px;
        border-radius: 999px;
        background: #2a2a2a;
        overflow: hidden;
      }

      .boot-bar span {
        display: block;
        height: 100%;
        width: 36%;
        border-radius: inherit;
        background: #e8a317;
        animation: boot-slide 1.1s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(310%);
        }
      }

      .boot-preview {
        height: 160px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        background: linear-gradient(90deg, #1c1c1c 0%, #252525 50%, #1c1c1c 100%);
        background-size: 200% 100%;
        animation: boot-shimmer 1.2s ease-in-out infinite;
      }

      @keyframes boot-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }

      .boot-line {
        height: 10px;
        border-radius: 4px;
        background: #1c1c1c;
      }

      .boot-line.short {
        width: 62%;
      }

      .boot-text {
        margin: 0;
        color: #9a9a9a;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-live="polite" aria-busy="true">
      <div class="boot-brand">OG Downloader</div>
      <div class="boot-bar" aria-hidden="true"><span></span></div>
      <div class="boot-preview" aria-hidden="true"></div>
      <div class="boot-line" aria-hidden="true"></div>
      <div class="boot-line short" aria-hidden="true"></div>
      <p class="boot-text">Reading page meta tags…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/popup/main.jsx"></script>
  </body>
</html>
